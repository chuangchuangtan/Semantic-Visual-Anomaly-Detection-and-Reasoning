[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomagentv1"
version = "0.1.0"
description = "AnomAgent: multi-step anomaly analysis for AI-generated images."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "openai>=1.0.0,<2",
  "pillow>=10.0.0",
  "tqdm>=4.66.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
anomagent = "anomagent.cli:main"

[tool.setuptools]
packages = ["anomagent"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["outputs", "runs", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
